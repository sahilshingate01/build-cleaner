<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>buildcleaner</title>
    <style>
      :root {
        --bg: #0b0e14;
        --panel: #141922;
        --line: #232a36;
        --fg: #cbd5e1;
        --muted: #6b7686;
        --accent: #4ea1ff;
        --danger: #ff5c5c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px/1.4 -apple-system, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
        -webkit-app-region: drag;
      }
      header input, header button { -webkit-app-region: no-drag; }
      input#path {
        flex: 1;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--fg);
        padding: 8px 10px;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      button {
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--fg);
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); color: #04101f; border-color: var(--accent); font-weight: 600; }
      button.danger { border-color: var(--danger); color: var(--danger); }
      button.danger:disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--line); color: var(--muted); }
      #stats {
        display: flex;
        gap: 22px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #stats b { color: var(--fg); font-weight: 600; }
      #stats span { color: var(--muted); }
      .wrap { flex: 1; overflow: auto; }
      table { width: 100%; border-collapse: collapse; table-layout: fixed; }
      th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
      tbody tr { transition: background 120ms ease; }
      tbody tr:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
      th { position: sticky; top: 0; background: var(--bg); color: var(--muted); font-weight: 500; }
      th button.sort { width: 100%; padding: 0; border: 0; background: transparent; color: inherit; text-align: inherit; font: inherit; cursor: pointer; }
      th button.sort:hover { color: var(--accent); }
      th button.sort[aria-sort="ascending"]::after { content: ' ↑'; }
      th button.sort[aria-sort="descending"]::after { content: ' ↓'; }
      td.size { font-family: ui-monospace, Menlo, monospace; text-align: right; white-space: nowrap; }
      td.cat { width: 110px; }
      .category { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; padding: 2px 7px; border: 1px solid color-mix(in srgb, var(--accent) 34%, var(--line)); border-radius: 999px; color: #8bc3ff; background: color-mix(in srgb, var(--accent) 11%, transparent); font: 600 11px/1.2 ui-monospace, Menlo, monospace; white-space: nowrap; }
      td.path { font-family: ui-monospace, Menlo, monospace; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      td.gone { color: var(--muted); text-decoration: line-through; }
      footer {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        border-top: 1px solid var(--line);
      }
      #status { color: var(--muted); margin-left: auto; }
      .pill { color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <input id="path" placeholder="/path/to/scan — e.g. ~/code" spellcheck="false" />
      <button id="choose">Choose…</button>
      <button id="scan" class="primary">Scan</button>
    </header>

    <div id="stats">
      <div><b id="s-dirs">0</b> <span>dirs</span></div>
      <div><b id="s-matches">0</b> <span>matches</span></div>
      <div><b id="s-size">0 B</b> <span>reclaimable</span></div>
      <div><b id="s-elapsed">0.0s</b> <span>elapsed</span></div>
    </div>

    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th style="width: 28px"><input type="checkbox" id="all" /></th>
            <th style="width: 90px; text-align: right"><button class="sort" data-sort="bytes" aria-sort="none">size</button></th>
            <th style="width: 110px"><button class="sort" data-sort="category" aria-sort="none">category</button></th>
            <th><button class="sort" data-sort="path" aria-sort="none">path</button></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <footer>
      <button id="del" class="danger" disabled>Delete selected</button>
      <span class="pill" id="selinfo">nothing selected</span>
      <span id="status">idle</span>
    </footer>

    <script src="renderer.js"></script>
  </body>
</html>
